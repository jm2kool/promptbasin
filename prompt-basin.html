<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prompt Basin">
<meta name="theme-color" content="#000000">
<title>Prompt Basin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --near-black: #080808;
    --surface: #0d0d0d;
    --surface2: #111111;
    --surface3: #161616;
    --border: #1a1a1a;
    --blue: #007AFF;
    --blue-bright: #0af;
    --blue-glow: rgba(0, 170, 255, 0.15);
    --blue-glow2: rgba(0, 170, 255, 0.08);
    --text: #f0f0f0;
    --text-dim: #666;
    --text-mid: #999;
    --safe-top: env(safe-area-inset-top, 44px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ── SCREENS ── */
  .screen {
    position: fixed;
    inset: 0;
    background: var(--black);
    display: flex;
    flex-direction: column;
    transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.38s ease;
    will-change: transform;
  }

  .screen.hidden {
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
  }

  .screen.slide-up {
    transform: translateY(100%);
    opacity: 0;
    pointer-events: none;
  }

  /* ── HEADER ── */
  .header {
    padding: calc(var(--safe-top) + 16px) 20px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    border: 1.5px solid var(--blue-bright);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 12px var(--blue-glow), inset 0 0 8px rgba(0,170,255,0.05);
    position: relative;
    overflow: hidden;
  }

  .logo-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,170,255,0.1) 0%, transparent 60%);
  }

  .logo-icon svg {
    width: 16px; height: 16px;
    stroke: var(--blue-bright);
    fill: none;
    stroke-width: 1.5;
    position: relative;
    z-index: 1;
  }

  .app-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  .app-title span {
    color: var(--blue-bright);
  }

  .add-btn {
    width: 36px; height: 36px;
    border: 1.5px solid var(--blue-bright);
    border-radius: 10px;
    background: var(--blue-glow2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 16px var(--blue-glow);
    transition: all 0.15s ease;
    flex-shrink: 0;
  }

  .add-btn:active {
    background: var(--blue-glow);
    transform: scale(0.93);
    box-shadow: 0 0 24px rgba(0,170,255,0.3);
  }

  .add-btn svg {
    width: 18px; height: 18px;
    stroke: var(--blue-bright);
    fill: none;
    stroke-width: 2;
  }

  /* ── COUNT BADGE ── */
  .count-line {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .count-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  .count-num {
    color: var(--blue-bright);
    font-weight: 500;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--border), transparent);
  }

  /* ── LIST ── */
  .list-container {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0 calc(var(--safe-bottom) + 12px);
    -webkit-overflow-scrolling: touch;
  }

  .list-container::-webkit-scrollbar { display: none; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
    padding: 40px 24px;
    text-align: center;
  }

  .empty-icon {
    width: 64px; height: 64px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    box-shadow: 0 0 40px rgba(0,170,255,0.04);
  }

  .empty-icon svg {
    width: 28px; height: 28px;
    stroke: var(--text-dim);
    fill: none;
    stroke-width: 1.5;
  }

  .empty-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-mid);
  }

  .empty-sub {
    font-size: 13px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.6;
  }

  /* ── PROMPT CARD ── */
  .prompt-card {
    margin: 6px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.18s ease;
  }

  .prompt-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--blue-bright);
    opacity: 0;
    transition: opacity 0.18s ease;
    box-shadow: 0 0 8px var(--blue-bright);
  }

  .prompt-card:active {
    background: var(--surface2);
    border-color: rgba(0,170,255,0.25);
    transform: scale(0.985);
  }

  .prompt-card:active::before { opacity: 1; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
    line-height: 1.3;
    flex: 1;
  }

  .card-arrow {
    width: 20px; height: 20px;
    flex-shrink: 0;
    margin-top: 1px;
    opacity: 0.3;
    transition: opacity 0.15s;
  }

  .prompt-card:active .card-arrow { opacity: 0.8; }

  .card-arrow svg {
    width: 100%; height: 100%;
    stroke: var(--blue-bright);
    fill: none;
    stroke-width: 2;
  }

  .card-meta {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-chars {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-chars::before {
    content: '';
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--blue-bright);
    opacity: 0.4;
    box-shadow: 0 0 4px var(--blue-bright);
  }

  /* ── DETAIL SCREEN ── */
  #detail-screen .header {
    padding-top: calc(var(--safe-top) + 12px);
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--blue-bright);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 0;
    transition: opacity 0.15s;
  }

  .back-btn:active { opacity: 0.6; }

  .back-btn svg {
    width: 18px; height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.5;
  }

  .detail-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.4px;
    margin-top: 14px;
    color: var(--text);
    line-height: 1.25;
  }

  .detail-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px;
    -webkit-overflow-scrolling: touch;
  }

  .detail-content::-webkit-scrollbar { display: none; }

  .prompt-display {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    line-height: 1.75;
    color: #d0d0d0;
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
  }

  .prompt-display::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--blue-bright), transparent);
    opacity: 0.3;
  }

  /* ── ACTION BUTTONS ── */
  .action-bar {
    padding: 16px 20px calc(var(--safe-bottom) + 16px);
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .action-btn {
    flex: 1;
    height: 50px;
    border-radius: 13px;
    border: 1.5px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.1px;
  }

  .action-btn svg {
    width: 16px; height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
  }

  .action-btn:active { transform: scale(0.94); }

  .btn-copy {
    background: var(--blue-bright);
    border-color: var(--blue-bright);
    color: #000;
    box-shadow: 0 0 20px rgba(0,170,255,0.25);
    flex: 1.4;
  }

  .btn-copy:active { background: #0099dd; box-shadow: 0 0 30px rgba(0,170,255,0.4); }

  .btn-edit {
    background: transparent;
    border-color: var(--border);
    color: var(--text-mid);
  }

  .btn-edit:active { border-color: rgba(0,170,255,0.4); color: var(--text); }

  .btn-delete {
    background: transparent;
    border-color: var(--border);
    color: #ff3b30;
    flex: 0.7;
  }

  .btn-delete:active { border-color: #ff3b30; background: rgba(255,59,48,0.08); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    transition: opacity 0.28s ease;
  }

  .modal-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .modal-overlay.hidden .modal-sheet {
    transform: translateY(100%);
  }

  .modal-sheet {
    width: 100%;
    background: var(--surface2);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--border);
    padding: 0 0 calc(var(--safe-bottom) + 12px);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 0;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }

  .modal-close {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface3);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }

  .modal-close:active { background: #222; }

  .modal-close svg {
    width: 14px; height: 14px;
    stroke: var(--text-mid);
    fill: none;
    stroke-width: 2.5;
  }

  .modal-body {
    padding: 20px 20px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .field-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-family: 'JetBrains Mono', monospace;
  }

  .field-input {
    width: 100%;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
    caret-color: var(--blue-bright);
  }

  .field-input:focus {
    border-color: rgba(0,170,255,0.4);
    box-shadow: 0 0 0 3px rgba(0,170,255,0.08);
  }

  textarea.field-input {
    min-height: 130px;
    resize: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.65;
  }

  .modal-save-btn {
    margin: 18px 20px 0;
    width: calc(100% - 40px);
    height: 52px;
    background: var(--blue-bright);
    border: none;
    border-radius: 14px;
    color: #000;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.2px;
    box-shadow: 0 0 24px rgba(0,170,255,0.2);
    transition: all 0.15s ease;
  }

  .modal-save-btn:active {
    transform: scale(0.97);
    box-shadow: 0 0 36px rgba(0,170,255,0.35);
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 90px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 10px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--blue-bright);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 16px rgba(0,170,255,0.1);
    z-index: 200;
    opacity: 0;
    transition: all 0.25s ease;
    white-space: nowrap;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── CONFIRM DIALOG ── */
  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 150;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: opacity 0.2s;
  }

  .confirm-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .confirm-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px 20px 20px;
    width: 100%;
    max-width: 300px;
    text-align: center;
  }

  .confirm-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .confirm-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 22px;
    line-height: 1.5;
  }

  .confirm-actions {
    display: flex;
    gap: 10px;
  }

  .confirm-cancel {
    flex: 1;
    height: 46px;
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-mid);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .confirm-cancel:active { opacity: 0.7; }

  .confirm-delete {
    flex: 1;
    height: 46px;
    background: rgba(255,59,48,0.12);
    border: 1px solid rgba(255,59,48,0.3);
    border-radius: 12px;
    color: #ff3b30;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .confirm-delete:active { background: rgba(255,59,48,0.2); }

  /* ── COPY FEEDBACK ── */
  .btn-copy.copied {
    background: #00c75a;
    border-color: #00c75a;
    box-shadow: 0 0 20px rgba(0,199,90,0.25);
  }

  /* subtle scan line atmosphere */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>

<!-- ══ HOME SCREEN ══ -->
<div class="screen" id="home-screen">
  <div class="header">
    <div class="header-row">
      <div class="logo-area">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h6"/><circle cx="19" cy="17" r="3"/></svg>
        </div>
        <div class="app-title">Prompt <span>Basin</span></div>
      </div>
      <div class="add-btn" onclick="openAddModal()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
    </div>
    <div class="count-line">
      <div class="count-text"><span class="count-num" id="count-display">0</span> prompts stored</div>
      <div class="divider-line"></div>
    </div>
  </div>

  <div class="list-container" id="prompt-list">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M12 8v8"/></svg>
      </div>
      <div class="empty-title">Basin is empty</div>
      <div class="empty-sub">Tap + to add your first prompt.<br>Store, copy, and reuse them anytime.</div>
    </div>
  </div>
</div>

<!-- ══ DETAIL SCREEN ══ -->
<div class="screen hidden" id="detail-screen">
  <div class="header">
    <div class="back-btn" onclick="goHome()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Basin
    </div>
    <div class="detail-title" id="detail-title">Prompt Title</div>
  </div>

  <div class="detail-content">
    <div class="prompt-display" id="detail-body"></div>
  </div>

  <div class="action-bar">
    <div class="action-btn btn-copy" id="copy-btn" onclick="copyPrompt()">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copy
    </div>
    <div class="action-btn btn-edit" onclick="openEditModal()">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Edit
    </div>
    <div class="action-btn btn-delete" onclick="confirmDelete()">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </div>
  </div>
</div>

<!-- ══ ADD/EDIT MODAL ══ -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modal-title">New Prompt</div>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <div class="field-label">Title</div>
        <input class="field-input" id="input-title" type="text" placeholder="e.g. System Prompt, Rewrite…" autocomplete="off">
      </div>
      <div>
        <div class="field-label">Prompt</div>
        <textarea class="field-input" id="input-prompt" placeholder="Paste your prompt here…"></textarea>
      </div>
    </div>
    <button class="modal-save-btn" id="save-btn" onclick="savePrompt()">Save Prompt</button>
  </div>
</div>

<!-- ══ DELETE CONFIRM ══ -->
<div class="confirm-overlay hidden" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">Delete Prompt?</div>
    <div class="confirm-sub">This will permanently remove the prompt from your basin.</div>
    <div class="confirm-actions">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-delete" onclick="deletePrompt()">Delete</button>
    </div>
  </div>
</div>

<!-- ══ TOAST ══ -->
<div class="toast" id="toast"></div>

<script>
  // ── STATE ──
  let prompts = [];
  let currentId = null;
  let isEditing = false;

  const STORAGE_KEY = 'prompt_basin_v1';

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      prompts = raw ? JSON.parse(raw) : [];
    } catch { prompts = []; }
    render();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(prompts));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  // ── RENDER ──
  function render() {
    const list = document.getElementById('prompt-list');
    const empty = document.getElementById('empty-state');
    const countEl = document.getElementById('count-display');

    countEl.textContent = prompts.length;

    // remove existing cards
    list.querySelectorAll('.prompt-card').forEach(c => c.remove());

    if (prompts.length === 0) {
      empty.style.display = 'flex';
      return;
    }
    empty.style.display = 'none';

    prompts.forEach(p => {
      const card = document.createElement('div');
      card.className = 'prompt-card';
      card.innerHTML = `
        <div class="card-top">
          <div class="card-title">${escHtml(p.title)}</div>
          <div class="card-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>
        <div class="card-meta">
          <div class="card-chars">${p.prompt.length.toLocaleString()} chars</div>
        </div>
      `;
      card.addEventListener('click', () => openDetail(p.id));
      list.appendChild(card);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── NAVIGATION ──
  function openDetail(id) {
    currentId = id;
    const p = prompts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('detail-title').textContent = p.title;
    document.getElementById('detail-body').textContent = p.prompt;

    const detail = document.getElementById('detail-screen');
    detail.classList.remove('hidden');
    // reset copy btn
    const cb = document.getElementById('copy-btn');
    cb.classList.remove('copied');
    cb.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy`;
  }

  function goHome() {
    document.getElementById('detail-screen').classList.add('hidden');
    currentId = null;
  }

  // ── MODAL ──
  function openAddModal() {
    isEditing = false;
    document.getElementById('modal-title').textContent = 'New Prompt';
    document.getElementById('save-btn').textContent = 'Save Prompt';
    document.getElementById('input-title').value = '';
    document.getElementById('input-prompt').value = '';
    document.getElementById('modal-overlay').classList.remove('hidden');
    setTimeout(() => document.getElementById('input-title').focus(), 300);
  }

  function openEditModal() {
    const p = prompts.find(x => x.id === currentId);
    if (!p) return;
    isEditing = true;
    document.getElementById('modal-title').textContent = 'Edit Prompt';
    document.getElementById('save-btn').textContent = 'Save Changes';
    document.getElementById('input-title').value = p.title;
    document.getElementById('input-prompt').value = p.prompt;
    document.getElementById('modal-overlay').classList.remove('hidden');
    setTimeout(() => document.getElementById('input-title').focus(), 300);
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  function savePrompt() {
    const title = document.getElementById('input-title').value.trim();
    const prompt = document.getElementById('input-prompt').value.trim();
    if (!title || !prompt) {
      showToast('Both fields required');
      return;
    }

    if (isEditing && currentId) {
      const p = prompts.find(x => x.id === currentId);
      if (p) {
        p.title = title;
        p.prompt = prompt;
        // update detail view
        document.getElementById('detail-title').textContent = title;
        document.getElementById('detail-body').textContent = prompt;
      }
      showToast('Prompt updated');
    } else {
      prompts.unshift({ id: uid(), title, prompt });
      showToast('Prompt saved');
    }

    save();
    render();
    closeModal();
  }

  // ── COPY ──
  function copyPrompt() {
    const p = prompts.find(x => x.id === currentId);
    if (!p) return;

    const btn = document.getElementById('copy-btn');

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(p.prompt).then(() => {
        flashCopy(btn);
      }).catch(() => fallbackCopy(p.prompt, btn));
    } else {
      fallbackCopy(p.prompt, btn);
    }
  }

  function fallbackCopy(text, btn) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
      flashCopy(btn);
    } catch {}
    document.body.removeChild(ta);
  }

  function flashCopy(btn) {
    btn.classList.add('copied');
    btn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Copied!`;
    showToast('Copied to clipboard');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy`;
    }, 2000);
  }

  // ── DELETE ──
  function confirmDelete() {
    document.getElementById('confirm-overlay').classList.remove('hidden');
  }

  function closeConfirm() {
    document.getElementById('confirm-overlay').classList.add('hidden');
  }

  function deletePrompt() {
    prompts = prompts.filter(x => x.id !== currentId);
    save();
    render();
    closeConfirm();
    goHome();
    showToast('Prompt deleted');
  }

  // ── TOAST ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ── SWIPE TO CLOSE MODAL ──
  let touchStartY = 0;
  const sheet = document.querySelector('.modal-sheet');

  sheet.addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  sheet.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - touchStartY;
    if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });

  sheet.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - touchStartY;
    sheet.style.transform = '';
    if (dy > 80) closeModal();
  }, { passive: true });

  // ── CLOSE MODAL ON OVERLAY TAP ──
  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.getElementById('confirm-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeConfirm();
  });

  // ── KEYBOARD ──
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeModal();
      closeConfirm();
    }
  });

  // ── BOOT ──
  load();
</script>
</body>
</html>
